# 광고 알림 — 하루 한 번.
#
# 9월 16일에 광고가 멈췄는데 열흘 동안 아무도 몰랐다. 그래서 만들었다.
#
# GitHub 의 cron 은 정각을 보장하지 않는다(몇 분~수십 분 늦을 수 있다).
# 일일 요약이라 몇 분 늦는 것은 문제되지 않는다.
# 같은 것을 두 번 보내지 않는 것은 함수 쪽에서 막는다.
name: 광고 알림

on:
  schedule:
    # 매일 한국시간 09:00 (UTC 00:00)
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: 이상 감지
        run: |
          curl -sS -X POST "${{ secrets.SUPABASE_URL }}/functions/v1/smart-worker" \
            -H "x-cron-key: ${{ secrets.ALERTS_CRON_KEY }}" \
            -H "Content-Type: application/json" \
            -d '{"job":"alerts"}' | tee /tmp/alerts.json
          echo

      - name: 일일 요약
        run: |
          curl -sS -X POST "${{ secrets.SUPABASE_URL }}/functions/v1/smart-worker" \
            -H "x-cron-key: ${{ secrets.ALERTS_CRON_KEY }}" \
            -H "Content-Type: application/json" \
            -d '{"job":"daily"}' | tee /tmp/daily.json
          echo

      - name: 승인 요청
        run: |
          curl -sS -X POST "${{ secrets.SUPABASE_URL }}/functions/v1/smart-worker" \
            -H "x-cron-key: ${{ secrets.ALERTS_CRON_KEY }}" \
            -H "Content-Type: application/json" \
            -d '{"job":"approvals"}' | tee /tmp/approvals.json
          echo

      # 주간 리포트는 월요일에만. 함수도 한 주에 한 번만 보내므로 이중으로 막힌다
      - name: 주간 리포트
        run: |
          if [ "$(date -u +%u)" != "1" ]; then
            echo "월요일이 아니라 건너뜁니다"
            exit 0
          fi
          curl -sS -X POST "${{ secrets.SUPABASE_URL }}/functions/v1/smart-worker" \
            -H "x-cron-key: ${{ secrets.ALERTS_CRON_KEY }}" \
            -H "Content-Type: application/json" \
            -d '{"job":"weekly"}' | tee /tmp/weekly.json
          echo
