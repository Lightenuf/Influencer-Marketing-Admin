# 고친 코드가 깨졌는지 먼저 본다.
# 배포는 main 에서만 하고, 이 검사는 손대는 모든 변경에서 돈다.
name: 검사

on:
  pull_request:
  push:
    branches: [main]

jobs:
  typecheck:
    name: 타입·문법 검사
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: 타입 검사
        run: npx tsc -b --noEmit
      - name: 빌드 확인
        run: npm run build
        env:
          GITHUB_PAGES: 'true'
